[package]
name = "my-kernel"
version = "0.1.0"
authors = ["Vinay A <vinayananda2@gmail.com>"]
edition = "2024"

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin ="0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "my-kernel"
test = true
bench = false

[package.metadata.bootimage]
test-args = ["-device","isa-debug-exit,iobase=0xf4,iosize=0x04"]
